name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  zenithd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find NDK
        run: |
          set -eux
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1 || true)
            if [ -z "$NDK" ]; then
              echo "::error::NDK not found"; exit 1
            fi
            export ANDROID_NDK_HOME="$NDK"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
      - name: Build zenithd (NDK)
        run: |
          set -eux
          cmake -S native -B native/build/arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build native/build/arm64 -j4
      - name: Upload zenithd binary
        uses: actions/upload-artifact@v4
        with:
          name: zenithd-arm64
          path: native/build/arm64/zenithd
          if-no-files-found: error
      - name: Package ROM module
        run: |
          mkdir -p zenith-rom/vendor/bin zenith-rom/vendor/etc
          cp native/build/arm64/zenithd zenith-rom/vendor/bin/
          cp daemon/init.zenith.rc zenith-rom/vendor/etc/
          cp daemon/config/profiles.json zenith-rom/vendor/etc/
          cp daemon/config/thermal_zones.json zenith-rom/vendor/etc/
          cp -r daemon/sepolicy zenith-rom/vendor/etc/selinux
          cd zenith-rom && tar czf ../zenith-rom-module.tar.gz .
      - name: Upload ROM module
        uses: actions/upload-artifact@v4
        with:
          name: zenith-rom-module
          path: zenith-rom-module.tar.gz

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, zenithd]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Bundle into release
        run: |
          cd artifacts
          mv app-debug-apk/app-debug.apk .
          mv zenithd-arm64/zenithd .
          mv zenith-rom-module/zenith-rom-module.tar.gz .
          zip -j zenithd-release.zip app-debug.apk zenithd zenith-rom-module.tar.gz
          SHA256=$(sha256sum zenithd-release.zip | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SHA256: $SHA256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          files: artifacts/zenithd-release.zip
          body: |
            SHA256: ${{ env.SHA256 }}
