name: Build zenithd

on:
  push:
    paths: ['daemon/rust/**']
  pull_request:
    paths: ['daemon/rust/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Check
        working-directory: daemon/rust
        run: cargo check

      - name: Build release
        working-directory: daemon/rust
        run: |
          cargo ndk -t arm64-v8a -o target/android build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zenithd-android-arm64
          path: daemon/rust/target/android/arm64-v8a/release/zenithd