name: Build zenithd

on:
  push:
    paths: ['daemon/rust/**']
  pull_request:
    paths: ['daemon/rust/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Configure Zig linker
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "zig cc -target aarch64-linux-android"
          EOF
          # Need a wrapper for cargo (space-separated args issue)
          printf '#!/usr/bin/env bash\nexec zig cc -target aarch64-linux-android "$@"\n' | sudo tee /usr/local/bin/aarch64-linux-android-cc > /dev/null
          sudo chmod +x /usr/local/bin/aarch64-linux-android-cc
          cat > ~/.cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android-cc"
          EOF

      - name: Check
        working-directory: daemon/rust
        run: cargo check

      - name: Build release
        working-directory: daemon/rust
        run: cargo build --release --target aarch64-linux-android

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zenithd-android-arm64
          path: daemon/rust/target/aarch64-linux-android/release/zenithd