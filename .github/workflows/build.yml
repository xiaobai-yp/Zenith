name: Build zenithd

on:
  push:
    paths: ['daemon/rust/**']
  pull_request:
    paths: ['daemon/rust/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Check
        working-directory: daemon/rust
        run: cargo check

      - name: Build release
        working-directory: daemon/rust
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo build --release --target aarch64-linux-android

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zenithd-android-arm64
          path: daemon/rust/target/aarch64-linux-android/release/zenithd