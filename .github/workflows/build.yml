name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  zenithd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Find NDK
        run: |
          set -eux
          # NDK is pre-installed on ubuntu-latest at $ANDROID_NDK_HOME
          # Fallback: find in standard locations
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/*/ 2>/dev/null | head -1 || true)
            if [ -z "$NDK" ]; then
              echo "::error::NDK not found"; exit 1
            fi
            export ANDROID_NDK_HOME="$NDK"
          fi
          echo "NDK: $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Build zenithd (NDK)
        run: |
          set -eux
          cmake -S native -B native/build/arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build native/build/arm64 -j4

      - name: Upload zenithd binaries
        uses: actions/upload-artifact@v4
        with:
          name: zenithd-arm64
          path: |
            native/build/arm64/zenithd
          if-no-files-found: error

      - name: Package ROM module
        run: |
          mkdir -p zenith-rom/vendor/bin zenith-rom/vendor/etc
          cp native/build/arm64/zenithd zenith-rom/vendor/bin/
          cp daemon/init.zenith.rc zenith-rom/vendor/etc/
          cp daemon/config/profiles.json zenith-rom/vendor/etc/
          cp daemon/config/thermal_zones.json zenith-rom/vendor/etc/
          cp -r daemon/sepolicy zenith-rom/vendor/etc/selinux
          cp tools/inject_zenithd_policy.sh zenith-rom/vendor/etc/
          chmod +x zenith-rom/vendor/etc/inject_zenithd_policy.sh
          cd zenith-rom && tar czf ../zenith-rom-module.tar.gz .

      - name: Upload ROM module
        uses: actions/upload-artifact@v4
        with:
          name: zenith-rom-module
          path: zenith-rom-module.tar.gz
